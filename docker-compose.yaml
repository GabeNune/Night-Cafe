services:
  db: 
    image: postgres:16
    container_name: all-hour-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: allhour
      POSTGRES_PASSWORD: allhour123
      POSTGRES_DB: allhour
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: